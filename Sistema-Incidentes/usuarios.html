<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios - Sistema de Incidentes</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="dashboard-body">

    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            🛡️ <span>SGI Ciberseguridad</span>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item">📊 Dashboard</a>
            <a href="incidentes.html" class="nav-item">🚨 Incidentes</a>
            <a href="categorias.html" class="nav-item">📁 Categorías</a>
            <a href="prioridades.html" class="nav-item">⚡ Prioridades</a>
            <a href="estados.html" class="nav-item">🔖 Estados</a>
            <a href="activos.html" class="nav-item">💻 Activos</a>
            <a href="usuarios.html" class="nav-item active">👥 Usuarios</a>
        </nav>
        <button onclick="cerrarSesion()" class="sidebar-logout">🚪 Cerrar Sesión</button>
    </aside>

    <!-- ===== CONTENIDO PRINCIPAL ===== -->
    <main class="main-content">
        <header class="top-header">
            <h1>👥 Gestión de Usuarios</h1>
            <div class="user-info">
                <span id="nombre-usuario">Cargando...</span>
                <div class="user-avatar" id="user-avatar">?</div>
            </div>
        </header>

        <section class="table-section">
            <div class="table-header">
                <h2>Listado de Usuarios</h2>
                <div class="filters">
                    <button type="button" class="btn-primary">➕ Nuevo Usuario</button>
                </div>
            </div>

            <table class="data-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Correo</th>
                        <th>Rol</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-usuarios">
                    <tr><td colspan="5" style="text-align:center;">Cargando...</td></tr>
                </tbody>
            </table>
        </section>
    </main>

    <!-- Contenedor oculto requerido por Google Translate -->
    <div id="google_translate_element" style="display:none;"></div>

    <!-- Tu script de usuarios (si lo tienes, ponlo aquí) -->
    <script src="usuarios.js"></script>

    <!-- ===== SCRIPT DE TRADUCCIÓN AUTOMÁTICA ===== -->
    <script type="text/javascript">
        // 1. Inicializamos el traductor de Google
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'es',
                includedLanguages: 'en',
                autoDisplay: false 
            }, 'google_translate_element');
        }

        // 2. Función para forzar la traducción
        function forzarTraduccion() {
            var cookieActual = document.cookie;
            if (cookieActual.indexOf('googtrans=/es/en') === -1) {
                document.cookie = "googtrans=/es/en; path=/";
                document.cookie = "googtrans=/es/en; path=/; domain=" + window.location.hostname;
                window.location.reload();
            }
        }

        // 3. Ejecutamos la función apenas cargue la página
        window.onload = function() {
            forzarTraduccion();
        };
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</body>
</html>
